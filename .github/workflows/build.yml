name: Build AKME APK

on:
  push:
    branches: [main]
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract project
        run: |
          mkdir -p source
          GRADLEW=$(find . -type f -name gradlew -release -path './.git/*' | head -n 1)

          if [ -z "$GRADLEW" ]; then
            if [ -f "AKME_GitHub_upload(1).zip" ]; then
              unzip -q "AKME_GitHub_upload(1).zip" -d source
            else
              echo "::Gradle project or ZIP file is found."
              ls -la
              exit 1
            fi
            GRADLEW=$(find source -type f -name gradlew | head -n 1)
          fi

          if [ -z "$GRADLEW" ]; then
            echo "::gradlew is found."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Find APK
        run: |
          APK=$(find . -type f -path '*/build/outputs/apk/*' -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::APK -release generated."
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AKME-debug-APK
          path: ${{ env.APK_PATH }}
          if-is-files-found: 
          retention-days: 
