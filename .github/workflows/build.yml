YAML

name: Build AKME Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate or extract project
        shell: bash
        run: |
          PROJECT_DIR=""

          if [ -f "pubspec.yaml" ] || [ -f "gradlew" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            mkdir -p "$RUNNER_TEMP/akme_source"

            while IFS= read -r ZIP_FILE; do
              Bash
if [ -f "$PROJECT_DIR/pubspec.yaml" ]; then
  echo "PROJECT_TYPE=flutter" >> "$GITHUB_ENV"
else
  echo "PROJECT_TYPE=gradle" >> "$GITHUB_ENV"
fiecho "Checking $ZIP_FILE"
              unzip -oq "$ZIP_FILE" -d "$RUNNER_TEMP/akme_source"

              PROJECT_DIR=$(find "$RUNNER_TEMP/akme_source" -name pubspec.yaml -type f -print -quit | xargs -r dirname)

              if [ -z "$PROJECT_DIR" ]; then
                PROJECT_DIR=$(find "$RUNNER_TEMP/akme_source" -name gradlew -type f -print -quit | xargs -r dirname)
              fi

              if [ -n "$PROJECT_DIR" ]; then
                break
              fi
            done < <(find . -type f -iname "*.zip")

          fi

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find . -name pubspec.yaml -type f -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find . -name gradlew -type f -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Flutter or Android Gradle project found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter Debug APK
        if: hashFiles('**/pubspec.yaml') != ''
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter --version
          flutter pub get
          flutter build apk --debug

      - name: Build Android Gradle APK
        if: hashFiles('**/pubspec.yaml') == ''
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AKME-Debug-APK
          path: |
            **/build/app/outputs/flutter-apk/app-debug.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
