
name: Build AKME APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate or extract Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p source

          GRADLEW="$(find . -type f -name gradlew -not -path './.git/*' -print -quit)"

          if [ -z "$GRADLEW" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No Gradle project or ZIP found."
              ls -la
              exit 1
            fi

            unzip -q "$ZIP_FILE" -d source
            GRADLEW="$(find source -type f -name gradlew -print -quit)"
          fi

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew not found."
            exit 1
          fi

          PROJECT_DIR="$(cd "$(dirname "$GRADLEW")" && pwd)"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Find Debug APK
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*' -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK not found."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AKME-debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7
